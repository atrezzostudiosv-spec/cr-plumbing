name: Phase 3 Heating Browser QA
on:
  push:
    branches:
      - qa/phase3-heating-visual-20261027
  workflow_dispatch:
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for browser-only review
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start branch-local static preview
        run: |
          mkdir -p "$RUNNER_TEMP/webroot"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/webroot/cr-plumbing"
          nohup python3 -m http.server 8765 --directory "$RUNNER_TEMP/webroot" > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          curl -fsI http://127.0.0.1:8765/cr-plumbing/hvac/heating/new-installation/
      - name: Render and verify 8 branch-local viewports
        env:
          BASE_URL: http://127.0.0.1:8765/cr-plumbing/
        run: node scripts/phase3_browser_qa.mjs
      - name: Preserve screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-heating-captures
          path: qa-output/
          retention-days: 7
