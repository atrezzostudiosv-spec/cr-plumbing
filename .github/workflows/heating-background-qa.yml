name: Heating full-bleed background QA
on:
  push:
    branches:
      - qa/heating-fullbleed-20261028
  workflow_dispatch:
jobs:
  heating-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start branch-local preview
        run: |
          mkdir -p "$RUNNER_TEMP/webroot"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/webroot/cr-plumbing"
          nohup python3 -m http.server 8765 --directory "$RUNNER_TEMP/webroot" >/tmp/cr-preview.log 2>&1 &
          sleep 2
          curl -fsI http://127.0.0.1:8765/cr-plumbing/hvac/heating/new-installation/
      - name: Check four viewports
        run: node scripts/heating_background_qa.mjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heating-fullbleed-review
          path: qa-heating-output/
          retention-days: 7
