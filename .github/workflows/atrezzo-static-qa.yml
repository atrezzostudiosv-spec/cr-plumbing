name: Atrezzo Static QA
on:
  push:
    branches:
      - audit/**
      - main
  pull_request:
    branches:
      - main
jobs:
  source-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Run non-destructive static audit
        run: python3 scripts/atrezzo_static_qa.py --fail-critical
      - name: Verify generated SEO metadata is current
        run: python3 scripts/build_seo.py --check
      - name: Verify sharing metadata, structured data and icon assets
        run: python3 scripts/check_seo.py
